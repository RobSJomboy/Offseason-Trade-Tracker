<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offseason Trade Tracker · Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tt.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { --ui: #0b1f36; --ui2: #12304f; --ui3: #1d4570; --line: rgba(246,241,229,.14); --txt: #f6f1e5; --dim: #a9b6c4;
    background: var(--ui); color: var(--txt); font: 500 16px/1.3 var(--cond); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--ui3); border: 0; border-bottom: 3px solid rgba(0,0,0,.25); border-radius: 2px; padding: 6px 12px 5px; cursor: pointer; white-space: nowrap;
    font: 600 15px/1.1 var(--head); text-transform: uppercase; letter-spacing: .02em; }
  button:hover { background: #275a8f; }
  button.act { background: var(--gold); color: var(--ink); }
  input[type=text], select { background: #fff; color: var(--ink); border: 0; border-radius: 2px; padding: 6px 8px; font-weight: 600; }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); }
  .k { font: 600 13px var(--cond); letter-spacing: .1em; color: var(--tan); text-transform: uppercase; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--navy); border-bottom: 5px solid var(--gold); flex-wrap: wrap; }
  header h1 { margin: 0 10px 0 0; font: 700 28px/1 var(--head); text-transform: uppercase; }
  header h1 b { color: var(--gold); }
  .grow { flex: 1; }
  .status { font: 600 14px var(--cond); color: var(--dim); }
  .status.ok { color: #7ed99d; } .status.bad { color: #ff8a8d; }
  #airBtn { min-width: 120px; }
  #airBtn.live { background: var(--red); }
  .modeSw { display: inline-flex; border: 2px solid var(--gold); border-radius: 3px; overflow: hidden; margin-right: 6px; }
  .modeSw button { border-radius: 0; border-bottom: 0; padding: 8px 18px 7px; font-size: 18px; background: transparent; }
  .modeSw button.act { background: var(--gold); color: var(--ink); }
  main { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
  #pool { display: flex; flex-direction: column; min-height: 0; background: var(--ui2); }
  .pool-top { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .filters button { padding: 4px 9px 3px; font-size: 13px; }
  #list { overflow-y: auto; flex: 1; padding: 4px 6px; }
  .row { display: grid; grid-template-columns: 54px 1fr auto; gap: 8px; align-items: center; padding: 7px 6px; cursor: pointer; user-select: none;
    border-left: 4px solid transparent; border-bottom: 1px solid var(--line); }
  .row:hover { background: rgba(246,241,229,.06); }
  .row.sel { border-left-color: var(--gold); background: rgba(233,185,73,.14); }
  .row .lgs { display: flex; }
  .row .lgs img { width: 30px; height: 30px; object-fit: contain; background: #fff; border-radius: 50%; padding: 2px; }
  .row .lgs img + img { margin-left: -10px; }
  .row .n { font: 600 18px/1.05 var(--head); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .m { font: 500 14px var(--cond); color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .m .mlb { color: #7ed99d; font-weight: 700; }
  .row .m .aav { color: #ff8a8d; font-weight: 700; }
  .row .cc { font: 700 12px/1 var(--cond); letter-spacing: .06em; color: var(--dim); text-align: right; }
  .row .cc b { display: block; font: 600 18px/1 var(--head); color: var(--gold); }
  .row.team { grid-template-columns: 40px 1fr auto; }
  .row.team img { width: 36px; height: 36px; object-fit: contain; }
  .sect { font: 700 13px var(--cond); letter-spacing: .12em; color: var(--tan); padding: 12px 6px 4px; text-transform: uppercase; }
  .more { padding: 10px 6px; color: var(--dim); font-size: 14px; }
  #centre { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 12px; gap: 10px; overflow-y: auto; }
  #preview { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; outline: 1px solid var(--line); flex: none; }
  #preview .stage.off .panel { opacity: .35; transform: none; }
  .offtag { position: absolute; right: 10px; top: 10px; font: 700 14px var(--head); background: var(--red); padding: 4px 8px; display: none; z-index: 3; }
  body.offair .offtag { display: block; }
  .guides { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  body.noguides .guides { display: none; }
  .guides .mask { position: absolute; background: rgba(120,85,40,.55); }
  .guides .cam { position: absolute; background: rgba(15,39,66,.72); border: 6px solid #fff; display: grid; place-items: center;
    font: 700 64px var(--head); color: rgba(246,241,229,.7); text-transform: uppercase; }
  .guides .safe { position: absolute; border: 4px dashed #2fbf71; }
  #say { background: var(--gold); color: var(--ink); padding: 10px 14px; font: 600 19px/1.3 var(--cond); display: flex; gap: 12px; align-items: baseline; }
  #say b { font: 700 14px var(--head); letter-spacing: .1em; flex: none; }
  #insp { display: flex; flex-direction: column; gap: 10px; background: var(--ui2); padding: 12px 14px; border-top: 4px solid var(--gold); }
  .bar { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
  .bar + .bar { padding-top: 10px; border-top: 1px solid var(--line); }
  #views { display: flex; gap: 14px; flex-wrap: wrap; flex: 1; }
  .vg { display: flex; flex-direction: column; gap: 4px; }
  .vg .k { padding-left: 2px; }
  .vg div { display: flex; gap: 4px; flex-wrap: wrap; }
  #views button { padding: 9px 12px 7px; font-size: 16px; }
  #views button small { font: 700 11px var(--cond); opacity: .6; margin-right: 5px; }
  #views button.live { box-shadow: inset 0 -4px 0 var(--red); }
  .step { display: flex; gap: 6px; }
  .step button { font-size: 20px; padding: 10px 18px 8px; }
  .help { font: 500 14px var(--cond); color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1><b>OFFSEASON</b> TRADE TRACKER</h1>
  <div class="modeSw" id="modeSw"><button data-m="trades">Trades</button><button data-m="teams">Teams</button></div>
  <button id="airBtn" title="Fade the graphic in / out on the display (A)">OFF AIR</button>
  <span class="grow"></span>
  <span class="k">room</span><input type="text" id="room" style="width:150px">
  <button id="copyUrl">Copy OBS URL</button>
  <button id="openOut">Open display</button>
  <span class="status" id="net">not sent</span>
</header>
<main>
  <section id="pool">
    <div class="pool-top">
      <input type="text" id="q" placeholder="Search a player or team (/)">
      <div class="filters" id="winF"></div>
      <div class="filters" id="kindF"><button data-k="all">All trades</button><button data-k="mlb">Had a big leaguer</button><button data-k="big">$10M+ contract</button>
        <select id="teamF" style="flex:1;min-width:0"></select></div>
    </div>
    <div id="list"></div>
  </section>
  <section id="centre">
    <div id="preview"><div class="offtag">OFF AIR</div></div>
    <div id="say"><b>SAY IT</b><span id="sayTxt"></span></div>
    <div id="insp">
      <div class="bar">
        <div id="views"></div>
        <div class="step"><button id="prev" title="Previous graphic (←)">‹</button><button id="next" title="Next graphic (→)">›</button></div>
      </div>
      <div class="bar">
        <label>Background <select id="bg"><option value="paper">TB paper</option><option value="clear">Transparent</option></select></label>
        <label><input type="checkbox" id="guides"> Show cam boxes in preview</label>
        <span class="grow"></span>
        <span class="help">← → step graphics · ↑ ↓ step the list · A on/off air · / search · 1–9 jump</span>
      </div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="tt.js"></script>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const HUB = TT.hubOf(params);
  const DEF = { room: 'tb-trades-' + Math.random().toString(36).slice(2, 7), mode: 'trades', view: 'f1', ti: null, team: '', on: false, bg: 'paper', guides: true,
    win: 'all', kind: 'all', teamF: '', q: '' };
  let S = Object.assign({}, DEF);
  try { Object.assign(S, JSON.parse(localStorage.getItem('ott-state') || '{}')); } catch {}
  S.q = '';
  if (S.ti == null || !TT.T[S.ti]) S.ti = TT.T.length - 1;
  const save = () => { try { localStorage.setItem('ott-state', JSON.stringify(S)); } catch {} };

  // ── preview ──
  const stage = TT.createStage($('preview'));
  const fit = () => { stage.el.style.transform = `scale(${$('preview').clientWidth / 1920})`; };
  new ResizeObserver(fit).observe($('preview')); fit();
  const guides = document.createElement('div'); guides.className = 'guides'; stage.el.appendChild(guides);
  (() => {
    const s = TT.SAFE_DEFAULT, C = TT.CAMS, v = C.video, h = C.bottom - C.top;
    const box = (cls, x, y, w, hh, t = '') => `<div class="${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px">${t}</div>`;
    guides.innerHTML = box('mask', 0, 0, 1920, v.t) + box('mask', 0, v.b, 1920, 1080 - v.b) + box('mask', 0, v.t, v.l, v.b - v.t) + box('mask', v.r, v.t, 1920 - v.r, v.b - v.t) +
      box('cam', 10, C.top, s.l - 18, h, 'Trev') + box('cam', s.r + 8, C.top, 1910 - s.r - 8, h, 'Jake') + box('safe', s.l, s.t, s.r - s.l, s.b - s.t);
  })();

  // ── transport ──
  const net = (t, c) => { $('net').textContent = t; $('net').className = 'status ' + c; };
  const send = TT.publisher(HUB, () => S.room, net);
  const wire = () => ({ app: 'ott', seq: Date.now(), on: S.on, view: S.view, ti: S.ti, team: S.team, bg: S.bg });

  // ── views bar ──
  const groups = [...new Set(TT.VIEWS.map(v => v.grp))];
  $('views').innerHTML = groups.map(g => `<div class="vg"><span class="k">${g}</span><div>${TT.VIEWS.map((v, i) => v.grp === g ? `<button data-v="${v.key}"><small>${i < 9 ? i + 1 : ''}</small>${TT.esc(v.label)}</button>` : '').join('')}</div></div>`).join('');
  $('views').onclick = e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); };
  function setView(k) { S.view = k; commit(); }
  function stepView(d) { const i = TT.VIEWS.findIndex(v => v.key === S.view); setView(TT.VIEWS[(i + d + TT.VIEWS.length) % TT.VIEWS.length].key); }
  $('prev').onclick = () => stepView(-1); $('next').onclick = () => stepView(1);

  // ── pool ──
  $('winF').innerHTML = `<button data-w="all">All</button>` + TT.OFF.slice().reverse().map(o => `<button data-w="${o}">${TT.short(o)}${o === TT.NOW ? '*' : ''}</button>`).join('');
  $('teamF').innerHTML = `<option value="">All teams</option>` + TT.TEAM_LIST.map(x => x[3]).sort().map(n => `<option>${n}</option>`).join('');
  $('winF').onclick = e => { const b = e.target.closest('[data-w]'); if (b) { S.win = b.dataset.w; paintList(); save(); } };
  $('kindF').onclick = e => { const b = e.target.closest('[data-k]'); if (b) { S.kind = b.dataset.k; paintList(); save(); } };
  $('teamF').onchange = () => { S.teamF = $('teamF').value; paintList(); save(); };
  $('q').oninput = () => { S.q = $('q').value; paintList(); };
  $('modeSw').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { S.mode = b.dataset.m; paintList(); save(); } };

  let shown = [];
  function filtered() {
    const q = S.q.trim().toLowerCase();
    if (S.mode === 'teams') return TT.teamsSorted.map(([g]) => g).filter(g => !q || g.toLowerCase().includes(q));
    return TT.T.filter(t => (S.win === 'all' || t.o === S.win) && (!S.teamF || t.g.includes(S.teamF))
      && (S.kind === 'all' || (S.kind === 'mlb' ? TT.hasMLB(t) : t.p.some(p => p[5] != null && p[5] >= 10)))
      && (!q || t.s.toLowerCase().includes(q) || t.g.join(' ').toLowerCase().includes(q))).sort((a, b) => b.d.localeCompare(a.d) || b.i - a.i);
  }
  function paintList() {
    document.querySelectorAll('#modeSw [data-m]').forEach(b => b.classList.toggle('act', b.dataset.m === S.mode));
    document.querySelectorAll('[data-w]').forEach(b => b.classList.toggle('act', b.dataset.w === S.win));
    document.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('act', b.dataset.k === S.kind));
    $('teamF').value = S.teamF;
    const tr = S.mode === 'trades';
    $('winF').style.display = $('kindF').style.display = tr ? '' : 'none';
    $('q').placeholder = tr ? 'Search a player or team (/)' : 'Search a team (/)';
    shown = filtered();
    if (!tr) {
      $('list').innerHTML = shown.map(g => `<div class="row team ${S.team === g ? 'sel' : ''}" data-team="${TT.esc(g)}"><img src="${TT.logo(g)}" alt=""><div><div class="n">${TT.esc(g)}</div><div class="m">#${TT.rankOf(g)} in winter trades</div></div><div class="cc"><b>${TT.teamCount[g]}</b>trades</div></div>`).join('');
      return;
    }
    let html = '', lastO = '';
    shown.slice(0, 400).forEach(t => {
      if (t.o !== lastO) { html += `<div class="sect">${TT.lab(t.o)}${t.o === TT.NOW ? ' · in progress' : ''}</div>`; lastO = t.o; }
      const big = t.p.find(p => p[5] != null && p[5] >= 10);
      const others = t.p.length > 1 ? ` +${t.p.length - 1}` : '';
      html += `<div class="row ${S.ti === t.i ? 'sel' : ''}" data-ti="${t.i}"><div class="lgs">${t.g.slice(0, 3).map(g => `<img src="${TT.logo(g)}" alt="">`).join('')}</div>
        <div style="min-width:0"><div class="n">${TT.esc(TT.headline(t))}${others ? `<small style="opacity:.6;font-size:14px">${others}</small>` : ''}</div><div class="m">${TT.esc(t.g.join(' · '))}${TT.hasMLB(t) ? ' · <span class="mlb">MLB</span>' : ''}${big ? ` · <span class="aav">$${Math.round(big[5])}M</span>` : ''}</div></div>
        <div class="cc">${TT.fmt(t.d)}</div></div>`;
    });
    $('list').innerHTML = html || '<div class="more">No trades match.</div>';
    if (shown.length > 400) $('list').innerHTML += `<div class="more">Showing 400 of ${shown.length}. Narrow it down.</div>`;
  }
  $('list').onclick = e => {
    const r = e.target.closest('.row'); if (!r) return;
    if (r.dataset.team) { S.team = r.dataset.team; S.view = 'team'; } else { S.ti = +r.dataset.ti; S.view = 'trade'; }
    commit(); paintList();
  };
  function stepList(d) {
    if (!shown.length) return;
    if (S.mode === 'teams') { const i = shown.indexOf(S.team); S.team = shown[Math.max(0, Math.min(shown.length - 1, i < 0 ? 0 : i + d))]; S.view = 'team'; }
    else { const i = shown.findIndex(t => t.i === S.ti); S.ti = shown[Math.max(0, Math.min(shown.length - 1, i < 0 ? 0 : i + d))].i; S.view = 'trade'; }
    commit(); paintList();
    const el = document.querySelector('#list .row.sel'); el && el.scrollIntoView({ block: 'nearest' });
  }

  // ── draw / commit ──
  function draw() {
    const v = stage.render(S);
    $('sayTxt').textContent = v.say || '';
    document.querySelectorAll('#views [data-v]').forEach(b => { b.classList.toggle('act', b.dataset.v === S.view); b.classList.toggle('live', S.on && b.dataset.v === S.view); });
    document.body.classList.toggle('offair', !S.on);
    document.body.classList.toggle('noguides', !S.guides);
    $('airBtn').textContent = S.on ? 'ON AIR' : 'OFF AIR'; $('airBtn').classList.toggle('live', S.on);
    $('bg').value = S.bg; $('guides').checked = S.guides;
  }
  function commit() { save(); draw(); send(wire()); }

  $('airBtn').onclick = () => { S.on = !S.on; commit(); };
  $('bg').onchange = () => { S.bg = $('bg').value; commit(); };
  $('guides').onchange = () => { S.guides = $('guides').checked; save(); draw(); };
  $('room').value = S.room;
  $('room').addEventListener('change', () => { S.room = $('room').value.trim() || DEF.room; $('room').value = S.room; commit(); });
  const outUrl = () => new URL('display.html', location.href.split('#')[0].split('?')[0]).href + '?room=' + encodeURIComponent(S.room) + (params.get('hub') ? '&hub=' + encodeURIComponent(HUB) : '');
  $('copyUrl').onclick = async () => {
    try { await navigator.clipboard.writeText(outUrl()); $('copyUrl').textContent = 'Copied!'; }
    catch { prompt('OBS Browser Source URL (1920×1080):', outUrl()); }
    setTimeout(() => $('copyUrl').textContent = 'Copy OBS URL', 1400);
  };
  $('openOut').onclick = () => window.open(outUrl(), 'ott-out', 'width=960,height=540');

  addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { stepView(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { stepView(-1); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { stepList(1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { stepList(-1); e.preventDefault(); }
    else if (e.key === 'a' || e.key === 'A') { S.on = !S.on; commit(); }
    else if (e.key === '/') { $('q').focus(); e.preventDefault(); }
    else if (/^[1-9]$/.test(e.key)) setView(TT.VIEWS[+e.key - 1].key);
  });

  paintList(); draw(); send(wire());
})();
</script>
</body>
</html>
